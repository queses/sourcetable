[tool.poetry]
name = "sourcetable-backend"
version = "0.1.0"
description = "FastAPI backend for SourceTable project"
authors = ["Maksim Kobozev <quesesr@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.118.3"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.40"}
asyncpg = "^0.31.0"
python-dotenv = "^1.0.0"
pydantic = "^2.12.5"
pydantic-settings = "^2.11.0"
alembic = "^1.14.0"
faker = "^25.1.0"
python-multipart = "^0.0.21"
openai = "^1.0.0"
httpx = "^0.27.0"
authlib = "^1.3.0"
itsdangerous = "^2.1.2"
pyjwt = "^2.10.1"
cryptography = "^46.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
black = "^24.1.0"
ruff = "^0.14.10"
pre-commit = "^4.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
